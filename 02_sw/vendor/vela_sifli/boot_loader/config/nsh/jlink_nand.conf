# SiFli SDK JLink profile for sf32lb52-nano_a128r16 (128MB NAND)
#
# Use with J-Link when debugging/flashing NAND boards:
#   JLINK_DEVICE = SF32LB52X_NAND
#
# openvela uses sftool for UART download; J-Link is optional for debug.
# NAND page size for external flash algo: 131072 (128KB) on some loaders.

JLINK_DEVICE=SF32LB52X_NAND
CORE=HCPU
CHIP=SF32LB52X
