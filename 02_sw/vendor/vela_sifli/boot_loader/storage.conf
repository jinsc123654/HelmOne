# 2 级 bootloader 默认启动存储介质选择
# ============================================================================
# 选择 2 级 bootloader 默认从哪种存储介质启动并加载镜像（ftab / bootloader /
# nuttx）。该值在“构建期”生效：build.sh 读取本文件后，向 bootloader 工程注入
# 对应的 BOOT_DEFAULT_FROM_* 宏，使 board/board.c 的 board_boot_from() 在 2 级
# bootloader 中固定返回该启动源（覆盖 ROM 通过外部管脚检测后写入 RTC backup 的
# 结果）。
#
# 可选值:
#   nand  - SPI NAND Flash（MPI2，默认）
#   sd    - SD / SD-NAND 卡（SDIO，SD1）
#   emmc  - eMMC（SDIO，SD1）
#   nor   - NOR Flash XIP（预留，见 ptab.nor.json）
#
# 说明:
#   - SD / eMMC 的读取实现见 board/boot_flash.c（init_sdnand / init_sdemmc /
#     read_sdnand / read_sdemmc），管脚见 board/board.c 的 board_pinmux_sd()。
#   - 也可用环境变量临时覆盖本文件: BOOT_STORAGE=sd ./build.sh
#   - 改动后需重新构建 bootloader 与 app（分区表变了要全量重建）:
#       python3 vendor/my_vendor/build_board.py build && build-boot
#   - 分区布局（config/nsh/，由 BOOT_STORAGE 自动选用，勿混用）:
#       nand  -> ptab.nand.json   （flash2@0x62000000，ftab@0 稀疏块对齐）
#       sd/emmc -> ptab.sdmmc.json（sd@0x62000000，MBR@0 + ftab@0x1000 紧凑排布）
#       nor   -> ptab.nor.json    （flash2@0x12000000，NOR XIP，预留）
#   - SD/eMMC 时 ftab 必须落在 0x1000：使 FLASH_TABLE_START_ADDR 等于二级 boot 的
#     g_config_addr(SDNAND_MEM_ADDR+0x1000)，ROM/2SFBL 才能正确定位镜像。
#   - 烧录介质自动选择：nand->-m nand，sd/emmc->-m sd，nor->-m nor。
#   - app（NuttX）侧也跟随本值：build 时由 build_board.py 生成
#     boards/.../include/my_vendor_boot_storage.h，决定 ptab.h 选 NAND/SD 分区头，
#     以及运行期 rootfs 挂载来源（NAND vs SDIO）。运行期挂载点统一为 /mnt/lfs。
BOOT_STORAGE=sd
